<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda Telefônica{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #2c3e50; color: #fff; }
        a.button, button { display: inline-block; padding: 8px 14px; background: #2c3e50; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        a.button.secondary { background: #7f8c8d; }
        a.button.danger, button.danger { background: #c0392b; }
        form p { margin: 10px 0; }
        input[type=text], select { padding: 6px; width: 100%; box-sizing: border-box; }
        .actions { margin-bottom: 16px; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #fff; }
        .badge.amigos { background: #2980b9; }
        .badge.familia { background: #27ae60; }
    </style>
</head>
<body>
    <h1><a href="{% url 'contato_list' %}" style="color:inherit; text-decoration:none;">📒 Agenda Telefônica</a></h1>
    {% block content %}{% endblock %}
</body>
</html>
