{% extends 'contatos/base.html' %}

{% block title %}{{ contato.nome }} - Agenda{% endblock %}

{% block content %}
<div class="card">
    <div style="height:8px; background:{% if contato.categoria == 'amigos' %}var(--blue){% else %}var(--green){% endif %};"></div>

    <div class="card-body">
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
            <div style="width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                        color:#fff; font-weight:500; font-size:22px;
                        background:{% if contato.categoria == 'amigos' %}var(--blue){% else %}var(--green){% endif %};">
                {{ contato.nome|first|upper }}
            </div>
            <div>
                <h2 style="margin:0 0 4px; font-size:20px; font-weight:500;">{{ contato.nome }}</h2>
                <span style="font-size:12px; font-weight:500; padding:4px 10px; border-radius:12px;
                             color:{% if contato.categoria == 'amigos' %}var(--blue-dark){% else %}#137333{% endif %};
                             background:{% if contato.categoria == 'amigos' %}var(--blue-light){% else %}var(--green-light){% endif %};">
                    {{ contato.get_categoria_display }}
                </span>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:16px; color:var(--text); font-size:14px;">
            <span class="material-icons" style="color:var(--text-secondary);">call</span>
            {{ contato.telefone }}
        </div>
    </div>

    <div class="card-footer">
        <a class="btn btn-text" href="{% url 'contato_list' %}">Voltar</a>
        <a class="btn btn-danger" href="{% url 'contato_delete' contato.pk %}">
            <span class="material-icons" style="font-size:18px;">delete</span> Excluir
        </a>
        <a class="btn btn-primary" href="{% url 'contato_update' contato.pk %}">
            <span class="material-icons" style="font-size:18px;">edit</span> Editar
        </a>
    </div>
</div>
{% endblock %}
