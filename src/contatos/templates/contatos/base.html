<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --blue: #1a73e8;
            --blue-dark: #1765cc;
            --blue-light: #e8f0fe;
            --green: #33b679;
            --green-light: #e6f4ea;
            --border: #dadce0;
            --text: #3c4043;
            --text-secondary: #5f6368;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --shadow-1: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
            --shadow-2: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }
        .material-icons { font-size: 20px; vertical-align: middle; }

        /* Top bar */
        .topbar {
            height: 64px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 0 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
        }
        .topbar .brand .icon-badge {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            color: var(--blue);
        }
        .topbar .brand span.title {
            font-size: 22px;
            color: var(--text-secondary);
            letter-spacing: .1px;
        }
        .topbar form.search {
            flex: 1;
            max-width: 720px;
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 24px;
            padding: 0 16px;
            height: 44px;
        }
        .topbar form.search:focus-within { background: var(--surface); box-shadow: var(--shadow-1); }
        .topbar form.search input {
            border: none;
            background: transparent;
            outline: none;
            flex: 1;
            font-size: 15px;
            padding: 0 12px;
            color: var(--text);
            font-family: inherit;
        }
        .topbar form.search .material-icons { color: var(--text-secondary); }
        .topbar .avatar {
            margin-left: auto;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 500;
            flex: 0 0 auto;
        }

        /* Layout: sidebar + main */
        .layout { flex: 1; display: flex; min-height: 0; }
        .sidebar {
            width: 260px;
            flex: 0 0 auto;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            overflow-y: auto;
        }
        .btn-criar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: none;
            border-radius: 24px;
            box-shadow: var(--shadow-1);
            padding: 10px 24px 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            margin-bottom: 28px;
            transition: box-shadow .15s ease;
        }
        .btn-criar:hover { box-shadow: var(--shadow-2); }
        .btn-criar .material-icons { color: var(--blue); font-size: 24px; }

        .sidebar h3 {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .3px;
            color: var(--text);
            text-transform: none;
            margin: 4px 0 8px;
        }
        .sidebar .filtro {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 7px 8px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
        }
        .sidebar .filtro:hover { background: var(--bg); }
        .sidebar .filtro.ativo { background: var(--blue-light); color: var(--blue-dark); font-weight: 500; }
        .sidebar .filtro .dot { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
        .sidebar .filtro .dot.todos { background: var(--text-secondary); }
        .sidebar .filtro .dot.amigos { background: var(--blue); }
        .sidebar .filtro .dot.familia { background: var(--green); }
        .sidebar .filtro .count { margin-left: auto; color: var(--text-secondary); font-size: 12px; }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        /* Shared card look for form/detail/confirm pages */
        .card {
            background: var(--surface);
            border-radius: 8px;
            box-shadow: var(--shadow-1);
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
        }
        .card .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card .card-header .material-icons { color: var(--blue); }
        .card .card-header h2 { margin: 0; font-size: 18px; font-weight: 500; }
        .card .card-body { padding: 24px; }
        .card .card-footer {
            padding: 16px 24px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            background: var(--bg);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            border-radius: 4px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
        }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover { background: var(--blue-dark); }
        .btn-text { background: transparent; color: var(--blue); }
        .btn-text:hover { background: var(--blue-light); }
        .btn-danger { background: #d93025; color: #fff; }
        .btn-danger:hover { background: #b3261e; }

        /* Form fields */
        .field { margin-bottom: 18px; }
        .field label {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
        }
        .field input[type=text], .field input[type=tel], .field select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            color: var(--text);
            background: var(--surface);
        }
        .field input:focus, .field select:focus { border-color: var(--blue); border-width: 2px; padding: 9px 11px; }
        .field .errorlist { list-style: none; margin: 6px 0 0; padding: 0; color: #d93025; font-size: 12px; }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-state .material-icons { font-size: 56px; color: var(--border); }

        @media (max-width: 720px) {
            .sidebar { display: none; }
            .topbar form.search { display: none; }
            main { padding: 16px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'contato_list' %}">
            <span class="icon-badge"><span class="material-icons" style="font-size:28px;">event_note</span></span>
            <span class="title">Agenda</span>
        </a>
        <form class="search" method="get" action="{% url 'contato_list' %}">
            <span class="material-icons">search</span>
            <input type="text" name="q" placeholder="Buscar contatos" value="{{ busca_atual|default:'' }}">
        </form>
        <div class="avatar" title="Usuário">A</div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a class="btn-criar" href="{% url 'contato_create' %}">
                <span class="material-icons">add</span>
                Criar
            </a>

            <h3>Minhas categorias</h3>
            <a class="filtro {% if not categoria_atual %}ativo{% endif %}" href="{% url 'contato_list' %}">
                <span class="dot todos"></span> Todos
                <span class="count">{{ total_contatos|default:'' }}</span>
            </a>
            <a class="filtro {% if categoria_atual == 'amigos' %}ativo{% endif %}" href="?categoria=amigos">
                <span class="dot amigos"></span> Amigos
                <span class="count">{{ total_amigos|default:'' }}</span>
            </a>
            <a class="filtro {% if categoria_atual == 'familia' %}ativo{% endif %}" href="?categoria=familia">
                <span class="dot familia"></span> Família
                <span class="count">{{ total_familia|default:'' }}</span>
            </a>
        </aside>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
